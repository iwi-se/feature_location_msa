<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MSA Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666;
    --border: #ddd;
    --accent: #2563eb;
    --running: #d97706;
    --done: #16a34a;
    --row-hover: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e6e6e6;
      --muted: #9aa0a6;
      --border: #2c2f36;
      --accent: #6ea8fe;
      --running: #f0b429;
      --done: #4ade80;
      --row-hover: #1f2228;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 1.5rem;
  }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .summary { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
  .threads {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .thread-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    font-size: 0.85rem;
  }
  .thread-card .slot { color: var(--muted); font-size: 0.75rem; }
  .thread-card .family { font-weight: 600; margin: 0.2rem 0; word-break: break-all; }
  .thread-card .stage { color: var(--accent); }
  .thread-card.idle { opacity: 0.5; }
  input[type=search] {
    width: 100%;
    max-width: 400px;
    padding: 0.5rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
  tr.file-row { cursor: pointer; }
  tr.file-row:hover { background: var(--row-hover); }
  .status-running { color: var(--running); }
  .status-done { color: var(--done); }
  .log-panel {
    display: none;
    background: var(--row-hover);
    font-family: ui-monospace, monospace;
    font-size: 0.8rem;
    white-space: pre-wrap;
    padding: 0.6rem 1rem;
  }
  .log-panel.open { display: table-row; }
  .log-panel td { border-bottom: 1px solid var(--border); }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <h1>MSA Dashboard</h1>
  <div class="summary" id="summary">Loading...</div>
  <div class="threads" id="threads"></div>
  <input type="search" id="search" placeholder="Filter by file name...">
  <table>
    <thead>
      <tr><th>File</th><th>Status</th><th>Stage</th><th>Variants</th><th>Duration</th><th>Log</th></tr>
    </thead>
    <tbody id="file-rows"></tbody>
  </table>

<script src="/static/app.js"></script>
</body>
</html>
